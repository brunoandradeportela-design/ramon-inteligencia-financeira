name: Sonda de feeds (diagnóstico)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python scripts/public_data/probe_feeds.py \
            "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notas?ano=2026" \
            "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/noticias" \
            "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicadoscopom" \
            "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notasimprensa" \
            "https://www.bcb.gov.br/api/feed/app/notas" \
            "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicados" \
            "https://agenciagov.ebc.com.br/noticias/RSS" \
            "https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml" \
            "https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/setembro/RSS"
