<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fintechs — Plataforma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script>
  /* aplica o tema antes da primeira pintura (evita flash) — RN-12: só apresentação */
  (function(){try{var p=localStorage.getItem('ramon.theme')||'system';var d=p==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;document.documentElement.setAttribute('data-theme',d);}catch(e){}})();
</script>
<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="root" aria-live="polite"><div class="content"><div class="skeleton" style="width:40%"></div></div></div>
<noscript>Esta aplicação requer JavaScript.</noscript>
</body>
</html>
